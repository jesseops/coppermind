{{define "title"}}Login — Coppermind{{end}}
{{define "content"}}
<div style="max-width:400px;margin:3rem auto;">
    <h1>Login</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group"><label>Username</label><input type="text" name="username" required autofocus></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <div class="form-group"><label><input type="checkbox" name="remember_me" style="width:auto;"> Remember me</label></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
</div>
{{end}}
