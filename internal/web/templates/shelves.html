{{define "title"}}My Shelves — Coppermind{{end}}
{{define "content"}}
<h1>My Shelves</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{range .Shelves}}
<a href="/shelves/{{.ID}}" style="display:flex;justify-content:space-between;padding:0.75rem;border:1px solid var(--color-border);border-radius:0.375rem;margin-top:0.5rem;text-decoration:none;color:inherit;">
    <span>{{.Name}} {{if not .IsPublic}}🔒{{end}}</span>
    <span style="color:var(--color-text-muted);">{{.WorkCount}} works</span>
</a>
{{end}}
<h2 style="margin-top:2rem;">Create Shelf</h2>
<form method="POST" action="/me/shelves">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
    <div class="form-group"><label>Description</label><input type="text" name="description"></div>
    <div class="form-group"><label><input type="checkbox" name="is_public" checked style="width:auto;"> Public</label></div>
    <button type="submit" class="btn btn-primary">Create</button>
</form>
{{end}}
