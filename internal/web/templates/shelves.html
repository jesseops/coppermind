{{define "title"}}My Shelves — Coppermind{{end}}
{{define "content"}}
<h1>My Shelves</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{range .Shelves}}
<a href="/shelves/{{.ID}}" class="flex justify-between p-3 border border-border rounded-md mt-2 no-underline text-inherit hover:border-primary transition">
    <span>{{.Name}} {{if not .IsPublic}}🔒{{end}}</span>
    <span class="text-text-muted">{{.WorkCount}} works</span>
</a>
{{end}}
<h2 class="mt-8">Create Shelf</h2>
<form method="POST" action="/me/shelves" class="max-w-lg">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
    <div class="form-group"><label>Description</label><input type="text" name="description"></div>
    <div class="form-group"><label class="flex items-center gap-2"><input type="checkbox" name="is_public" checked class="w-auto"> Public</label></div>
    <button type="submit" class="btn btn-primary">Create</button>
</form>
{{end}}
