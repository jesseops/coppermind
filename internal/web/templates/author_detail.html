{{define "title"}}{{.Author.Name}} — Coppermind{{end}}
{{define "content"}}
<h1>{{.Author.Name}}</h1>
<div class="works-grid">
    {{range .Works}}
    <a href="/works/{{.ID}}" class="work-card" style="text-decoration:none;color:inherit;">
        <div class="cover">{{if .HasCover}}<img src="/covers/{{.ID}}" alt="{{.Title}}" loading="lazy">{{else}}{{coverInitials .Title}}{{end}}</div>
        <div class="title">{{.Title}}</div>
    </a>
    {{end}}
</div>
{{end}}
