{{define "title"}}Currently Reading — Coppermind{{end}}
{{define "content"}}
<h1>Currently Reading</h1>
{{if .States}}
<div class="works-grid">
    {{range .States}}
    <div class="work-card">
        <div class="cover">{{if .CoverPath}}<img src="/covers/{{.WorkID}}" loading="lazy">{{else}}{{coverInitials .WorkTitle}}{{end}}</div>
        <div class="title">{{.WorkTitle}}</div>
        <div class="bg-border rounded-full h-1 mt-2">
            <div class="bg-primary rounded-full h-full" style="width:{{multiply .Progress 100}}%;"></div>
        </div>
    </div>
    {{end}}
</div>
{{else}}<p class="text-text-muted mt-4">Not reading anything right now.</p>{{end}}
{{end}}
