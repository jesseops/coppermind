{{template "base" .}}
{{define "title"}}Currently Reading — Coppermind{{end}}
{{define "content"}}
<h1>Currently Reading</h1>
{{if .States}}
<div class="works-grid">
    {{range .States}}
    <div class="work-card">
        <div class="cover">{{if .CoverPath}}<img src="/covers/{{.WorkID}}" loading="lazy">{{else}}{{coverInitials .WorkTitle}}{{end}}</div>
        <div class="title">{{.WorkTitle}}</div>
        <div style="background:var(--color-border);border-radius:9999px;height:4px;margin-top:0.5rem;">
            <div style="background:var(--color-primary);border-radius:9999px;height:100%;width:{{multiply .Progress 100}}%;"></div>
        </div>
    </div>
    {{end}}
</div>
{{else}}<p style="color:var(--color-text-muted);margin-top:1rem;">Not reading anything right now.</p>{{end}}
{{end}}
