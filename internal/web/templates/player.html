{{define "title"}}Listening: {{.Work.Title}} — Coppermind{{end}}
{{define "content"}}
<div class="flex items-center justify-between my-4">
    <h1>{{.Work.Title}}</h1>
    <a href="/works/{{.Work.ID}}" class="btn btn-surface btn-sm">← Back</a>
</div>
<div class="mt-4" x-data="audioPlayer({{.Edition.ID}}, {{len .Tracks}}, '{{.CSRFToken}}')">
    {{range .Tracks}}
    <div class="flex items-center gap-4 py-2 border-b border-border">
        <span class="text-text-muted min-w-8">{{.TrackIndex}}</span>
        <span class="flex-1">{{if .Title}}{{.Title}}{{else}}Track {{.TrackIndex}}{{end}}</span>
        <audio controls preload="none" class="h-8" data-track-index="{{.TrackIndex}}" data-track-id="{{.ID}}"><source src="/audio/{{.ID}}"></audio>
    </div>
    {{end}}
</div>
{{end}}
