{{template "base" .}}
{{define "title"}}Import — Coppermind{{end}}
{{define "content"}}
<h1>Import Books</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Results}}
<div style="margin:1rem 0;padding:1rem;background:var(--color-surface);border-radius:0.375rem;">
    {{range .Results}}<p>{{.}}</p>{{end}}
</div>
{{end}}
<form method="POST" action="/admin/import" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group"><label>Select files (EPUB, MOBI, MP3, M4B)</label><input type="file" name="files" multiple accept=".epub,.mobi,.mp3,.m4b,.pdf"></div>
    <button type="submit" class="btn btn-primary">Import</button>
</form>
{{end}}
