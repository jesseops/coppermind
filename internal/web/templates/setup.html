{{define "title"}}Setup — Coppermind{{end}}
{{define "content"}}
<div style="max-width:400px;margin:3rem auto;">
    <h1>Welcome to Coppermind</h1>
    <p style="color:var(--color-text-muted);margin-bottom:1rem;">Create your admin account and first library.</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="POST" action="/setup">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group"><label>Admin Username</label><input type="text" name="username" required autofocus></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <div class="form-group"><label>Library Name</label><input type="text" name="library_name" value="My Library"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create</button>
    </form>
</div>
{{end}}
