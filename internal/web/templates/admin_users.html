{{template "base" .}}
{{define "title"}}Users — Coppermind{{end}}
{{define "content"}}
<h1>Users</h1>
<table>
    <tr><th>ID</th><th>Username</th><th>Display Name</th><th>Role</th></tr>
    {{range .Users}}<tr><td>{{.ID}}</td><td>{{.Username}}</td><td>{{.DisplayName}}</td><td>{{.Role}}</td></tr>{{end}}
</table>
<h2 style="margin-top:2rem;">Add User</h2>
<form method="POST" action="/admin/users">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
    <div class="form-group"><label>Role</label><select name="role"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div>
    <button type="submit" class="btn btn-primary">Add User</button>
</form>
{{end}}
