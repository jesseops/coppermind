{{define "title"}}Series — Coppermind{{end}}
{{define "content"}}
<h1>Series</h1>
{{if .Series}}
<div class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-2 mt-4">
    {{range .Series}}
    <a href="/series/{{.ID}}" class="flex justify-between px-3 py-2 border border-border rounded-md no-underline text-inherit hover:border-primary transition">
        <span>{{.Name}}</span>
        <span class="text-text-muted">{{.WorkCount}} works</span>
    </a>
    {{end}}
</div>
{{else}}<p class="text-text-muted mt-4">No series yet.</p>{{end}}
{{end}}
