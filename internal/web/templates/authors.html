{{define "title"}}Authors — Coppermind{{end}}
{{define "content"}}
<h1>Authors</h1>
{{if .Authors}}
<div class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-2 mt-4">
    {{range .Authors}}
    <a href="/authors/{{.ID}}" class="flex justify-between px-3 py-2 border border-border rounded-md no-underline text-inherit hover:border-primary transition">
        <span>{{.Name}}</span>
        <span class="text-text-muted">{{.WorkCount}} works</span>
    </a>
    {{end}}
</div>
{{else}}<p class="text-text-muted mt-4">No authors yet.</p>{{end}}
{{end}}
