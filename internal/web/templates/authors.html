{{define "title"}}Authors — Coppermind{{end}}
{{define "content"}}
<h1>Authors</h1>
{{if .Authors}}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0.5rem;margin-top:1rem;">
    {{range .Authors}}
    <a href="/authors/{{.ID}}" style="display:flex;justify-content:space-between;padding:0.5rem 0.75rem;border:1px solid var(--color-border);border-radius:0.375rem;text-decoration:none;color:inherit;">
        <span>{{.Name}}</span>
        <span style="color:var(--color-text-muted);">{{.WorkCount}} works</span>
    </a>
    {{end}}
</div>
{{else}}<p style="color:var(--color-text-muted);margin-top:1rem;">No authors yet.</p>{{end}}
{{end}}
