{{define "title"}}Edit: {{.Work.Title}} — Coppermind{{end}}
{{define "content"}}
<h1>Edit: {{.Work.Title}}</h1>
<form method="POST" action="/admin/works/{{.Work.ID}}" class="max-w-lg">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group"><label>Title</label><input type="text" name="title" value="{{.Work.Title}}"></div>
    <div class="form-group"><label>Description</label><textarea name="description" rows="4">{{.Work.Description}}</textarea></div>
    <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/works/{{.Work.ID}}" class="btn btn-surface btn-sm">Cancel</a>
    </div>
</form>
<form method="POST" action="/admin/works/{{.Work.ID}}/delete" class="mt-8 border-t border-border pt-4">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn btn-sm bg-error text-white" onclick="return confirm('Delete this work?')">Delete Work</button>
</form>
{{end}}
